<style>
  /* Colours sampled from the Ria Zone logo */
  :root {
    --siyah: #15120F;    /* paint black */
    --krem: #F6E5C5;     /* letter cream */
    --kagit: #F6F5F2;    /* paper */
    --kirmizi: #E0481B;  /* red-orange */
    --hardal: #D89431;   /* mustard */
    --yesil: #568875;    /* teal, as in "zone" */
    --yesil-koyu: #427063;
    --cizgi: rgba(246, 229, 197, 0.15);
    --display: "Vollkorn", Georgia, "Times New Roman", serif;
    --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background-color: var(--siyah);
    /* fine print grain, like the logo's distressed ink */
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .96  0 0 0 0 .9  0 0 0 0 .77  0 0 0 .5 -.2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/></svg>");
    color: var(--krem);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.4;
  }

  :focus-visible { outline: 3px solid var(--hardal); outline-offset: 2px; }

  .defs { position: absolute; width: 0; height: 0; }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--kagit);
    color: var(--siyah);
    padding-top: 16px;
  }

  .hero__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 1144px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .hero__place {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--yesil-koyu);
  }

  .lang {
    display: flex;
    padding: 3px;
    border: 1.5px solid var(--siyah);
    border-radius: 8px;
  }

  .lang button {
    border: 0;
    background: transparent;
    color: var(--siyah);
    font: 600 14px/1 var(--body);
    padding: 9px 12px;
    min-width: 44px;
    border-radius: 5px;
    cursor: pointer;
  }

  .lang button[aria-pressed="true"] {
    background: var(--siyah);
    color: var(--krem);
  }

  .hero :focus-visible { outline-color: var(--yesil-koyu); }

  .hero h1 { margin: 0; }

  .logo {
    display: block;
    width: min(80vw, 400px);
    height: auto;
    margin: 0 auto -6px;
    mix-blend-mode: multiply;
  }

  .edge {
    display: block;
    width: 100%;
    height: 34px;
    margin-bottom: -1px;
    fill: var(--siyah);
  }

  /* ---------- Category bar ---------- */
  .cats {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(21, 18, 15, 0.96);
    border-bottom: 1px solid var(--cizgi);
  }

  .cats ul {
    display: flex;
    gap: 8px;
    margin: 0 auto;
    padding: 10px 20px;
    max-width: 1144px;
    list-style: none;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .cats ul::-webkit-scrollbar { display: none; }

  .cats a {
    display: block;
    white-space: nowrap;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1.5px solid rgba(246, 229, 197, 0.3);
    color: var(--krem);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
  }

  .cats a[aria-current="true"] {
    background: var(--renk);
    border-color: var(--renk);
    color: var(--siyah);
  }

  /* ---------- Menu ---------- */
  main {
    max-width: 1144px;
    margin: 0 auto;
    padding: 6px 20px 28px;
  }

  .group {
    padding-top: 34px;
    scroll-margin-top: 58px;
    break-inside: avoid;
  }

  /* painted colour block behind each category name */
  .group h2 {
    position: relative;
    z-index: 0;
    display: inline-block;
    margin: 0 0 10px -4px;
    padding: 5px 18px 2px 12px;
    font-family: var(--display);
    font-weight: 900;
    font-size: 30px;
    line-height: 1.15;
    color: var(--siyah);
  }

  .group h2::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--renk);
    transform: rotate(-1.2deg);
    filter: url(#firca);
  }

  .group ul { margin: 0; padding: 0; list-style: none; }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--cizgi);
  }

  .group li:last-child .item { border-bottom: 0; }

  .item__name { font-weight: 500; }

  .item__size {
    margin-left: 6px;
    font-size: 14px;
    font-weight: 400;
    color: rgba(246, 229, 197, 0.62);
    white-space: nowrap;
  }

  .price {
    flex: none;
    min-width: 88px;
    padding: 6px 10px 3px;
    border-radius: 5px;
    background: var(--renk);
    color: var(--siyah);
    font-family: var(--display);
    font-weight: 900;
    font-size: 19px;
    line-height: 1.1;
    text-align: center;
    font-variant-numeric: lining-nums tabular-nums;
    white-space: nowrap;
  }

  .price small {
    margin-left: 4px;
    font-family: var(--body);
    font-size: 11px;
    font-weight: 600;
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid var(--cizgi);
    padding: 30px 20px 44px;
  }

  .foot { max-width: 1104px; margin: 0 auto; }

  .foot__name {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: 30px;
    line-height: 1.1;
  }

  .foot__place {
    margin: 2px 0 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--yesil);
  }

  .foot a {
    display: inline-block;
    margin: 18px 0 16px;
    padding: 12px 16px;
    border-radius: 6px;
    background: var(--hardal);
    color: var(--siyah);
    font-weight: 600;
    text-decoration: none;
  }

  .foot__note { margin: 0; font-size: 14px; color: rgba(246, 229, 197, 0.7); }

  /* ---------- Wider screens ---------- */
  @media (min-width: 820px) {
    .hero { padding-top: 24px; }
    .hero__top { padding: 0 32px; }
    .logo { width: 440px; }
    .edge { height: 52px; }
    .cats ul { padding: 12px 32px; }
    main { padding: 6px 32px 40px; columns: 2; column-gap: 64px; }
    .group h2 { font-size: 34px; }
    footer { padding: 40px 32px 56px; }
    .foot { max-width: 1080px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<svg class="defs" aria-hidden="true">
  <defs>
    <filter id="firca" x="-6%" y="-25%" width="112%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.3" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="hero">
  <div class="hero__top">
    <p class="hero__place">CIU, Lefkoşa</p>
    <div class="lang" role="group" aria-label="Dil / Language / Язык">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>

    { id: "sicak", name: { tr: "Sıcak İçecek", en: "Hot drinks", ru: "Горячие напитки" }, items: [

      { n: { tr: "Çay", en: "Tea", ru: "Чай" }, p: 70 }
    ]}
  ];

  /* Logo colours, handed out to the categories in turn */
  var COLOURS = ["var(--kirmizi)", "var(--hardal)", "var(--yesil)"];

  var UI = {
    tr: { title: "Ria Zone Menü", nav: "Kategoriler", note: "Fiyatlar Türk Lirası (TL) cinsindendir." },
    en: { title: "Ria Zone Menu", nav: "Categories", note: "Prices are in Turkish lira (TL)." },
    ru: { title: "Ria Zone Меню", nav: "Категории", note: "Цены указаны в турецких лирах (TL)." }
  };

  var lang = "tr";
  var menuEl = document.getElementById("menu");
  var catList = document.getElementById("catList");
  var catsNav = document.getElementById("cats");
  var activeId = MENU[0].id;
  var spy = null;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function setActive(id) {
    activeId = id;
    var links = catList.querySelectorAll("a");
    for (var i = 0; i < links.length; i++) {
      var on = links[i].dataset.id === id;
      if (on) {
        links[i].setAttribute("aria-current", "true");
        var target = links[i].offsetLeft - (catList.clientWidth - links[i].offsetWidth) / 2;
        catList.scrollTo({ left: target, behavior: "smooth" });
      } else {
        links[i].removeAttribute("aria-current");
      }
    }
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = UI[lang].title;
    document.getElementById("priceNote").textContent = UI[lang].note;
    catsNav.setAttribute("aria-label", UI[lang].nav);

    menuEl.textContent = "";
    catList.textContent = "";

    MENU.forEach(function (group, index) {
      var colour = COLOURS[index % COLOURS.length];

      var li = el("li");
      var a = el("a", null, group.name[lang]);
      a.href = "#" + group.id;
      a.dataset.id = group.id;
      a.style.setProperty("--renk", colour);
      li.appendChild(a);
      catList.appendChild(li);

      var section = el("section", "group");
      section.id = group.id;
      section.style.setProperty("--renk", colour);
      /* lowercase like the logo; locale-aware so İ and I come out right in Turkish */
      section.appendChild(el("h2", null, group.name[lang].toLocaleLowerCase(lang)));

      var ul = el("ul");
      group.items.forEach(function (item) {
        var row = el("li");
        var line = el("div", "item");
        var name = el("span", "item__name", item.n[lang]);
        if (item.s) name.appendChild(el("span", "item__size", item.s[lang]));
        var price = el("span", "price", String(item.p));
        price.appendChild(el("small", null, "TL"));
        line.appendChild(name);
        line.appendChild(price);
        row.appendChild(line);
        ul.appendChild(row);
      });
      section.appendChild(ul);
      menuEl.appendChild(section);
    });

    if (spy) spy.disconnect();
    if ("IntersectionObserver" in window) {
      spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) setActive(entry.target.id);
        });
      }, { rootMargin: "-15% 0px -75% 0px" });
      menuEl.querySelectorAll(".group").forEach(function (s) { spy.observe(s); });
    }
    setActive(activeId);
  }

  document.querySelectorAll(".lang button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      lang = btn.dataset.lang;
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      render();
    });
  });

  render();
</script>
